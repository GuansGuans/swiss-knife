name: net-ease-cloud-music

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      verbose:
        description: Verbosity level
        type: choice
        options:
          - '-v'
          - '-vv'
          - '-vvv'
        default: '-v'
        required: true
        # # - Cloudflare Workers Cron Triggers: <https://developers.cloudflare.com/workers/configuration/cron-triggers/>
        # # - cron-job.org: <https://cron-job.org/>
        # # - EasyCron: <https://www.easycron.com/>
        # # - GitHub Actions: <https://docs.github.com/actions/using-workflows/events-that-trigger-workflows#schedule>
        # # - Linux `cron`: <https://man7.org/linux/man-pages/man5/crontab.5.html>
        # schedule:
        #   # UTC 17:30 -> CST (China) 1:30 <https://datetime360.com/cn/utc-cst-china-time/>
        #   - cron: '*/30 * * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  net-ease-cloud-music:
    name: net-ease-cloud-music
    runs-on: ubuntu-latest
    # env:
    #   EXCEPTION_NOTIFY_NTFY_TOPIC: ${{ secrets.EXCEPTION_NOTIFY_NTFY_TOPIC }}
    #   EXCEPTION_NOTIFY_WPUSH_APIKEY: ${{ secrets.EXCEPTION_NOTIFY_WPUSH_APIKEY }}
    #   NET_EASE_CLOUD_MUSIC_COOKIES: ${{ secrets.NET_EASE_CLOUD_MUSIC_COOKIES }}
    #   NET_EASE_CLOUD_MUSIC_USER_IDS: ${{ secrets.NET_EASE_CLOUD_MUSIC_USER_IDS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          # Use composer.json for key, if composer.lock is not committed.
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          # key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Run composer install
        run: |
          # sed -i '' 's/^APP_ENV=local$/APP_ENV=production/' .env.example
          # sed -i -e 's/^APP_ENV=local$/APP_ENV=production/' .env.example
          sed -i -e 's/^APP_DEBUG=true$/APP_DEBUG=false/' -e 's/^APP_ENV=local$/APP_ENV=production/' .env.example
          composer install --no-dev --no-interaction --ansi -v
          composer app:install
          php artisan optimize --no-interaction --ansi -v
          # php artisan exception-notify:test --ansi -v
          # cat "storage/logs/laravel-$(date +%F).log

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Setup Other
        run: |
          chrome --version
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk && sudo fc-cache -f && fc-match sans:lang=zh-cn
          sudo apt-get install -y jpegoptim optipng pngquant gifsicle webp libavif-bin && sudo npm install -g svgo

      - name: Run net-ease-cloud-music
        run: |
          log_file="storage/logs/laravel-$(date +%F).log"; [ ! -f "$log_file" ] || { cat "$log_file" && false; }
          php artisan net-ease-cloud-music --no-interaction --ansi ${{ inputs.verbose || '-v' }} || { cat "$log_file" && false; }

        # keepalive-schedule-job:
        #   name: Keepalive schedule job
        #   runs-on: ubuntu-latest
        #   permissions:
        #     actions: write
        #   steps:
        #     - uses: actions/checkout@v7
        #     - uses: gautamkrishnar/keepalive-workflow@v2
