name: net-ease-cloud-music

on:
  push:
  workflow_dispatch:
  schedule: # UTC 17:30 -> CST (China) 1:30 see https://datetime360.com/cn/utc-cst-china-time/
    - cron: '*/20 * * * *'

permissions:
  contents: write

jobs:
  net-ease-cloud-music:
    name: net-ease-cloud-music
    runs-on: ubuntu-latest
    # env:
    #   EXCEPTION_NOTIFY_NTFY_TOPIC: ${{ secrets.EXCEPTION_NOTIFY_NTFY_TOPIC }}
    #   EXCEPTION_NOTIFY_WPUSH_APIKEY: ${{ secrets.EXCEPTION_NOTIFY_WPUSH_APIKEY }}
    #   NET_EASE_CLOUD_MUSIC_COOKIES: ${{ secrets.NET_EASE_CLOUD_MUSIC_COOKIES }}
    #   NET_EASE_CLOUD_MUSIC_USER_IDS: ${{ secrets.NET_EASE_CLOUD_MUSIC_USER_IDS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          # Use composer.json for key, if composer.lock is not committed.
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          # key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Run composer install
        run: |
          # sed -i '' 's/^APP_ENV=local$/APP_ENV=production/' .env.example
          sed -i -e 's/^APP_DEBUG=true$/APP_DEBUG=false/' -e 's/^APP_ENV=local$/APP_ENV=production/'  .env.example
          composer install --no-dev --no-interaction --ansi -v
          php artisan env --no-interaction --ansi -v
          php artisan optimize --no-interaction --ansi -v
          php artisan storage:link --no-interaction --ansi -v
          php artisan about --no-interaction --ansi -v

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          # https://github.com/browser-actions/setup-chrome#supported-version-formats
          chrome-version: stable

      - name: Run net-ease-cloud-music
        run: |
          chrome --version
          sudo apt-get install -y jpegoptim optipng pngquant gifsicle webp libavif-bin && sudo npm install -g svgo
          php artisan net-ease-cloud-music --no-interaction --ansi -v

